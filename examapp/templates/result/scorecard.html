<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table,
        tr,
        td,
        th {
            border: 3px solid red;
        }

        table {
            border-collapse: collapse;
        }
    </style>
    {% load static %}

    <link rel="stylesheet" href="{% static 'css/student.css' %}">
</head>

<body>
    <h1 align="center" style="display: inline; margin-left: 680px;">Scorecard</h1><button style="margin-left: 550px;"><a href="/examapp/logoutuser">LogOut</a></button>

    <table>
        <tr>
            <th>Question No</th>
            <th>Question</th>
            <th>User Answer</th>
            <th>Correct Answer</th>
        </tr>
        {% for res in response %}
        <tr>
            <td>{{res.0}}</td>
            <td>{{res.1}}</td>
            <td>{{res.2}}</td>
            <td>{{res.3}}</td>
        </tr>
        {% endfor %}
    </table>

    <span>Final Score :{{finalscore}}</span>
</body>

</html>
